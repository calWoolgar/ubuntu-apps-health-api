name: ubuntu-apps-health-api

services:
  api:
    image: ubuntu-apps-health-api:${IMAGE_TAG:-local}
    build:
      context: .
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
